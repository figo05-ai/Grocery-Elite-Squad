parameters:
  paths:
    - ./app
  exclude_files:
    - .*test.*
  layers:
    - name: Controller
      collectors:
        - type: className
          regex: ^App\\Http\\Controllers\\.*
    - name: Model
      collectors:
        - type: className
          regex: ^App\\Models\\.*
    - name: Service
      collectors:
        - type: className
          regex: ^App\\Services\\.*
    - name: Job
      collectors:
        - type: className
          regex: ^App\\Jobs\\.*
  ruleset:
    Controller:
      - Service
      - Model
      - Job
    Service:
      - Model
      - Job
    Job:
      - Model
      - Service
    Model: ~
